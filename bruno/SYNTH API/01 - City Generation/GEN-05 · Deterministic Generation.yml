info:
  name: GEN-05 · Deterministic Generation
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/generate?name=SeedTest&width=10&height=8&seed=42"
  params:
    - name: name
      value: SeedTest
      type: query
    - name: width
      value: "10"
      type: query
    - name: height
      value: "8"
      type: query
    - name: seed
      value: "42"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 · Deterministic generation works", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Same seed produces same tiles", () => {
          const city = res.getBody();

          const previous = bru.getVar("previousTiles");

          if (previous !== undefined) {
            expect(JSON.stringify(city.tiles)).to.equal(previous);
          }

          bru.setVar("previousTiles", JSON.stringify(city.tiles));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
