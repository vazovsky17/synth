info:
  name: GEN-03 · Invalid Dimensions
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/generate?width=0&height=8&seed=42"
  params:
    - name: width
      value: "0"
      type: query
    - name: height
      value: "8"
      type: query
    - name: seed
      value: "42"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 · Invalid dimensions rejected", () => {
          expect(res.getStatus()).to.equal(400);
        });

        test("Correct validation message", () => {
          const body = res.getBody();
          expect(body.error).to.equal("Bad Request");
          expect(body.message).to.equal("Width must be positive");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
