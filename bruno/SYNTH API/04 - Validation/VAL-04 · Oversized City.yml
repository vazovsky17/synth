info:
  name: VAL-04 · Oversized City
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cities"
  body:
    type: json
    data: |-
      {
        "name": "Huge City",
        "width": 10000,
        "height": 10000,
        "seed": 42
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 · Oversized city rejected", () => {
          expect(res.getStatus()).to.equal(400);
        });

        test("City was not created", () => {
          expect(res.getStatus()).to.not.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
