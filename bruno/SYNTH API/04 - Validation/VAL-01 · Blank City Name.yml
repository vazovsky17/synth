info:
  name: VAL-01 · Blank City Name
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cities"
  body:
    type: json
    data: |-
      {
        "name": "",
        "width": 10,
        "height": 8,
        "seed": 42
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 · Blank name rejected", () => {
          expect(res.getStatus()).to.equal(400);
        });

        test("City was not created", () => {
          expect(res.getStatus()).to.not.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
