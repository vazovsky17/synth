info:
  name: CITY-03 · Get City by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/{{testCityId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 · City retrieved", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Correct city ID", () => {
          const city = res.getBody();
          const id = Number(bru.getEnvVar("testCityId"));

          expect(city.id).to.equal(id);
        });

        test("Correct number of tiles", () => {
          const city = res.getBody();

          expect(city.tiles).to.be.an("array");
          expect(city.tiles.length).to.equal(
            city.width * city.height
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
