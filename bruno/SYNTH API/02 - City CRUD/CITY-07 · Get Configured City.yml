info:
  name: CITY-07 · Get Configured City
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/{{configuredCityId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("configured city contains 900 tiles", function () {
            expect(res.getBody().tiles).to.have.lengthOf(900);
        });

        test("custom road spacing is applied", function () {
            const tiles = res.getBody().tiles;

            const road = tiles.find(t => t.x === 6 && t.y === 7);
            const building = tiles.find(t => t.x === 4 && t.y === 7);

            expect(road, "Tile (6, 7)").to.exist;
            expect(building, "Tile (4, 7)").to.exist;

            expect(road.type, "Tile (6, 7)").to.equal("ROAD");
            expect(building.type, "Tile (4, 7)").to.not.equal("ROAD");
        });

        test("custom commercial radius is applied", function () {
            const tiles = res.getBody().tiles;

            const tile = tiles.find(
                t => t.x === 17 && t.y === 17
            );

            expect(tile, "Tile (17, 17)").to.exist;
            expect(tile.type).to.equal("COMMERCIAL");
        });

        test("returns the newly created city", function () {
            expect(String(res.getBody().id))
                .to.equal(String(bru.getEnvVar("configuredCityId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
