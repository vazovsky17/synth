info:
  name: CITY-02 · Get All Cities
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 · Cities retrieved", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is an array", () => {
          expect(res.getBody()).to.be.an("array");
        });

        test("New city exists in the list", () => {
          const cities = res.getBody();
          const id = Number(bru.getEnvVar("testCityId"));

          expect(cities.some(city => city.id === id)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
