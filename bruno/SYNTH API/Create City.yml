info:
  name: Create City
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/cities
  body:
    type: json
    data: |-
      {
        "name": "Vazie City",
        "width": 10,
        "height": 8,
        "seed": 42
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
