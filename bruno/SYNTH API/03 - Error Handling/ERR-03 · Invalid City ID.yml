info:
  name: ERR-03 · Invalid City ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/abc"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 · Invalid ID rejected", () => {
          expect(res.getStatus()).to.equal(400);
        });

        test("Invalid ID does not cause server error", () => {
          expect(res.getStatus()).to.not.equal(500);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
