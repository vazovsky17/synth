info:
  name: ERR-01 · City Not Found
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cities/{{missingCityId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("404 · Missing city", () => {
          expect(res.getStatus()).to.equal(404);
        });

        test("Correct error response", () => {
          const body = res.getBody();
          expect(body.error).to.equal("Not Found");
          expect(body.message).to.equal(
            "City with id 999999 not found"
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
