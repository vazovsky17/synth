services:
  postgres:
    image: postgres:17
    container_name: synth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synth
      POSTGRES_USER: synth
      POSTGRES_PASSWORD: synth_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - synth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synth -d synth" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  synth_postgres_data: