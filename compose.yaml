
services:
  postgres:
    image: postgres:17
    container_name: synth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synth
      POSTGRES_USER: synth
      POSTGRES_PASSWORD: synth_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - synth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synth -d synth"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synth-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/synth
      SPRING_DATASOURCE_USERNAME: synth
      SPRING_DATASOURCE_PASSWORD: synth_dev_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  synth_postgres_data:
